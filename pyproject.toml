[project]
name = "opspilot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
	"ollama>=0.6.3",
	"pydantic>=2.13.5",
	"psycopg[binary]>=3.2,<4",
	"mcp>=2,<3",
	"langgraph",
	"langgraph-checkpoint-sqlite"
]

[project.optional-dependencies]
dev = [
	"pytest>=9.1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]
namespaces = false

[tool.pytest.ini_options]
markers = [
	"integration: requires an explicitly configured local database"
]
