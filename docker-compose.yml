services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    environment:
      POSTGRES_DB: opspilot
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: opspilot_local_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot -d opspilot"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    build:
      context: .
    image: opspilot:local
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      OLLAMA_HOST: "http://host.docker.internal:11434"
      OPSPILOT_INVESTIGATION_MODEL: "${OPSPILOT_INVESTIGATION_MODEL-qwen3:4b}"
      OPSPILOT_DIAGNOSIS_MODEL: "${OPSPILOT_DIAGNOSIS_MODEL-qwen3:4b}"
      OPSPILOT_WORKFLOW_DIAGNOSIS_MODEL: "${OPSPILOT_WORKFLOW_DIAGNOSIS_MODEL-qwen3:8b}"
      OPSPILOT_SERVICE: "${OPSPILOT_SERVICE-checkout-service}"
      OPSPILOT_MAX_STEPS: "${OPSPILOT_MAX_STEPS-6}"
      OPSPILOT_WORKFLOW_NUM_CTX: "${OPSPILOT_WORKFLOW_NUM_CTX-8192}"
      OPSPILOT_WORKFLOW_NUM_PREDICT: "${OPSPILOT_WORKFLOW_NUM_PREDICT-2048}"
    volumes:
      - workflow_data:/opt/opspilot/out/workflows
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  postgres_data:
  workflow_data:
